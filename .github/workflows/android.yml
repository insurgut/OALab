name: Android tests and permanently signed release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: https://insurgut.github.io/OALab/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"; fi
          echo "Using SDK manager: $SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Reuse or bootstrap PUBLIC DEVELOPMENT signing identity
        id: signing
        run: |
          set -euo pipefail
          umask 077
          # Owner-requested, intentionally insecure: this private key is public.
          # Anyone can forge app updates. NEVER use for a production app.
          ALIAS="oalab-public-dev"
          PASSWORD="OAlab_PUBLIC_TEST_SIGNING_2026"
          KEYSTORE_PATH="$RUNNER_TEMP/oalab-public-dev.p12"
          KEYSTORE_B64="signing/oalab-public-dev.p12.b64"
          PIN="signing/oalab-public-cert-sha256.txt"
          mkdir -p signing
          if [[ ! -s "$KEYSTORE_B64" ]]; then
            if [[ -e "$PIN" ]]; then
              echo "::error::Pinned signing identity exists but the private key is missing. Refusing rotation."
              exit 1
            fi
            echo "::warning::Bootstrapping PUBLIC UNTRUSTED signing key. Anyone can forge app updates."
            keytool -genkeypair -alias "$ALIAS" -keyalg RSA -keysize 3072 \
              -sigalg SHA256withRSA -storetype PKCS12 -validity 36500 \
              -keystore "$KEYSTORE_PATH" -storepass "$PASSWORD" -keypass "$PASSWORD" \
              -dname "CN=OAlab PUBLIC DEV KEY, OU=UNTRUSTED TEST SIGNING, O=OAlab" \
              -noprompt
            base64 -w0 "$KEYSTORE_PATH" > "$KEYSTORE_B64"
            printf '\n' >> "$KEYSTORE_B64"
            FINGERPRINT="$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$PASSWORD" -alias "$ALIAS" |
              grep -m1 'SHA256:' | sed -E 's/.*SHA256:[[:space:]]*//' |
              tr -d ':' | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
            printf '%s\n' "$FINGERPRINT" > "$PIN"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f "$KEYSTORE_B64" "$PIN"
            git commit -m "Bootstrap public untrusted development signing key (unsafe by design)"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          base64 --decode "$KEYSTORE_B64" > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$PASSWORD" -alias "$ALIAS" >/dev/null
          ACTUAL_CERT="$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$PASSWORD" -alias "$ALIAS" |
            grep -m1 'SHA256:' | sed -E 's/.*SHA256:[[:space:]]*//' |
            tr -d ':' | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          EXPECTED_CERT="$(tr -d ':[:space:]' < "$PIN" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$EXPECTED_CERT" =~ ^[0-9a-f]{64}$ || "$ACTUAL_CERT" != "$EXPECTED_CERT" ]]; then
            echo "::error::Public test signing certificate changed. Never silently rotate signing keys."
            exit 1
          fi
          echo "OALAB_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "OALAB_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "OALAB_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "OALAB_KEY_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "OALAB_CERT_SHA256=$EXPECTED_CERT" >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "### WARNING: PUBLIC UNTRUSTED DEVELOPMENT SIGNING" >> "$GITHUB_STEP_SUMMARY"
          echo "This build uses a PUBLIC private key. Anyone can forge an OAlab update." >> "$GITHUB_STEP_SUMMARY"
      - name: Run unit tests and compile
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease --stacktrace
          echo "APK_PATH=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
      - name: Verify published APK has the pinned certificate
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$APK"
          "$SIGNER" verify --verbose --print-certs "$APK"
          ACTUAL="$("$SIGNER" verify --print-certs "$APK" | grep -m1 'Signer #1 certificate SHA-256 digest:' | sed -E 's/.*digest:[[:space:]]*//' | tr -d ':' | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if [[ "$ACTUAL" != "$OALAB_CERT_SHA256" ]]; then
            echo "::error::APK signing certificate differs from pinned identity. No release created."
            exit 1
          fi
          echo "Verified permanent OAlab signing certificate: $ACTUAL"
      - name: Upload verified signed APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OALab-signed-release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish versioned APK (keep previous releases)
        if: steps.signing.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$VERSION"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Version $TAG already published. Bump versionName to create a new release."
            exit 1
          fi
          cp "$APK_PATH" "OAlab-v$VERSION.apk"
          printf '\n* ВНИМАНИЕ: приложение подписано ПУБЛИЧНЫМ НЕБЕЗОПАСНЫМ ключом SHA-256 %s. Любой может подделать обновление.\n' "$OALAB_CERT_SHA256" >> lupd.txt
          gh release create "$TAG" "OAlab-v$VERSION.apk" "lupd.txt#lupd.txt" --title "OAlab $VERSION" --notes-file "lupd.txt" --prerelease

      - name: Prepare public APK-only update channel
        if: steps.signing.outputs.available == 'true'
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n1)"
          mkdir -p public-update
          cp "OAlab-v$VERSION.apk" public-update/
          cp lupd.txt public-update/lupd.txt
          python3 -c 'import json,sys; v=sys.argv[1]; base="https://insurgut.github.io/OALab/"; json.dump({"version":v,"apk":base+"OAlab-v"+v+".apk","notes":base+"lupd.txt"}, open("public-update/update.json","w"))' "$VERSION"
      - name: Detect public Pages endpoint
        if: steps.signing.outputs.available == 'true'
        id: page_state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ENABLED="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.has_pages' || echo false)"
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
      - name: Upload public update site artifact
        if: steps.page_state.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-update
      - name: Deploy APK update site
        if: steps.page_state.outputs.enabled == 'true'
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Remove signing keystore from runner
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/oalab-public-dev.p12" ]]; then
            rm -f "$RUNNER_TEMP/oalab-release.jks"
          fi
